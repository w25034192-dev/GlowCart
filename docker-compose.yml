services:
  db:
    image: postgres:16-alpine
    container_name: glowcart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glowcart}
      POSTGRES_USER: ${POSTGRES_USER:-glowcart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - glowcart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glowcart_user} -d ${POSTGRES_DB:-glowcart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowcart-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-glowcart_user}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-glowcart}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    container_name: glowcart-frontend
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  glowcart_pgdata:

